openapi: "3.1.0"
info:
  title: Moru Engine API
  description: >
    engine <-> desktop local contract. The FastAPI sidecar binds to 127.0.0.1
    on a port chosen by the Electron main process and requires the session
    token issued at spawn time (Authorization: Bearer <token>) on every route
    except /health.
  version: "0.1.0"
servers:
  - url: "http://127.0.0.1:{port}"
    variables:
      port:
        default: "43110"
paths:
  /health:
    get:
      summary: Liveness probe polled by Electron main during startup handshake
      security: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { type: string, const: ok }
                  version: { type: string }
  /shutdown:
    post:
      summary: Graceful shutdown requested by Electron before-quit
      responses:
        "202": { description: shutdown scheduled }
  /jobs:
    post:
      summary: Start a job
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobRequest" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
  /jobs/{jobId}:
    get:
      summary: Job status
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { description: unknown job }
  /jobs/{jobId}/cancel:
    post:
      summary: >-
        Cancel a running job (partial results preserved; a translate job's
        checkpoint is kept, so the session stays resumable)
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      responses:
        "202": { description: cancellation requested }
  /jobs/{jobId}/snapshot:
    get:
      summary: Compact job progress snapshot for renderer restoration
      description: >-
        Reduces the full buffered history to latest progress per file/stage,
        cumulative token/glossary state, active batches, recent ticker/error
        samples and the terminal frame. cursor is the last event sequence in
        the snapshot; reconnect to /events?after=cursor for a gap-free live
        continuation without replaying tens of thousands of old frames.
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobSnapshot" }
        "404": { description: unknown job }
  /jobs/{jobId}/mod-sources:
    get:
      summary: CurseForge identities for the scan's installed mod JARs
      description: >-
        Discovery starts in the background after a successful scan, using
        minecraftinstance.json, Prism .pw.toml metadata, then fingerprint
        matches for remaining JARs. Failures never fail the scan, and retain
        launcher matches. Restored translate session ids are also accepted.
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      responses:
        "200":
          description: Current or persisted mod identities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModSources" }
        "404": { description: unknown job }
        "409": { description: job has no mod sources }
  /jobs/{jobId}/events:
    get:
      summary: >
        WebSocket upgrade (?token= query or Authorization header; optional
        after=N replays only frames whose seq is greater than N).
        Every frame carries {seq, emitted_at}. Replays buffered events, then
        streams live JSON frames:
        progress {stage, file?, done, total} (scan progress uses
        {stage, current, total, message}; the scan job emits a second
        "parse" stage while it counts entries per file, and a
        "migration" stage with current 0 then 1 while it indexes a previous
        translation; the translate job emits the same "migration" stage in
        its own {stage, done, total} shape while it rebuilds that index),
        entry_failed {key, file, errors} (file is the source file the key
        belongs to, relative to the modpack root),
        entry_done {key, source, translated} (sampled every ~5th freshly
        translated entry, texts truncated to 120 chars - GUI live ticker),
        tokens {prompt_tokens, completion_tokens, total_tokens, cached_tokens}
        (cumulative usage, emitted after each glossary-curation attempt and
        each translated batch; cached_tokens = cumulative prompt tokens
        served from the provider cache),
        batch_started {request_id, file, key, entries, started_at} and
        batch_finished {request_id} (live provider-request slot tracking),
        glossary_progress {done, total, new_terms, chunk?, attempt?, error?, skipped?}
        (extraction chunk progress; attempt/error present when a
        schema-invalid LLM response is being retried with the error fed
        back, skipped=true when a chunk gave up after retries),
        glossary_extracted {new_terms},
        and a single terminal frame {type: done|failed|cancelled|interrupted,
        status} after which the socket closes with code 1000. Done,
        user-cancelled and interrupted translate frames carry {stats};
        stats.migration_hits counts exact
        A/B/C matches reused from a previous translation, and stats.categories
        maps web-facing category keys to non-failed entry counts (an empty map
        means none). Every terminal frame of a checkpointed translate job
        (any run that calls a provider) carries {resumable}: true while the
        session's checkpoint is kept for POST /jobs {resume: true} - every
        outcome except done. interrupted frames also carry {reason, error,
        detail?}: reason is quota (the provider reported spent credit or an
        exhausted daily quota, which stops the run at once, or kept refusing
        for capacity (429) with no call succeeding for 120 s; the run stops
        instead of failing every remaining batch), auth (a CLI subscription
        provider refused or lacks its login, or is switched off) or
        shutdown (the engine stopped mid-run); error is a user-facing message
        and detail the provider's own error excerpt;
        done export frames carry {zip_path, overrides_zip_path,
        bilingual_zip_path, bilingual_overrides_zip_path, file_count}.
        Each path is null when its output tree is empty. Bilingual archive
        names are "<stem> (병기).zip" and "<stem> (병기)_overrides.zip".
        Upload progress also includes {stage: mods, current, total, message}
        with the current mod display name. Done upload frames carry
        {pack_id, url, modpack_slug?, mod_packs: {shared, skipped, failed,
        skipped_reason?}}. skipped_reason is login_required, disabled, or
        unresolved. The engine does not know a Modpack Index id and omits
        bundle_url; the desktop links to /ko/modpack/{modpack_slug}.
      parameters:
        - { $ref: "#/components/parameters/JobId" }
        - name: after
          in: query
          description: last event seq already applied by the client
          schema: { type: integer, minimum: 0 }
      responses:
        "101": { description: switching protocols }
  /scan/{jobId}/result:
    get:
      summary: Category/handler tree of a completed scan job
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanResult" }
  /translate/{jobId}/entries:
    get:
      summary: Paginated entry table for the review screen
      parameters:
        - { $ref: "#/components/parameters/JobId" }
        - name: filter
          in: query
          description: >-
            Entry status buckets, plus two manual-translation views that are
            not statuses: `flagged` (bookmarked by a hand translator) and
            `stale_source` (hand-translated, then the source string changed
            under it on a later scan).
          schema:
            type: string
            enum:
              [
                all,
                pending,
                failed,
                warning,
                modified,
                flagged,
                stale_source,
              ]
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, maximum: 500, default: 100 }
        - name: search
          in: query
          description: >-
            Case-insensitive substring match over key, source and translated
            text. Applied to the whole filtered set BEFORE pagination, so the
            review screen can find entries on any page.
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntryPage" }
  /translate/{jobId}/graph:
    get:
      summary: >
        Translation-graph snapshot for the desktop graph canvas. Serves the
        live pipeline graph while the job runs; after completion (session
        restorations included) the graph is rebuilt from result entries.
      parameters:
        - { $ref: "#/components/parameters/JobId" }
        - name: q
          in: query
          description: >-
            Case-insensitive substring over term surface, display source and
            settled target.
          schema: { type: string, maxLength: 200 }
        - name: status
          in: query
          description: settled = at least one defining entry is translated
          schema: { type: string, enum: [all, settled, pending], default: all }
        - name: limit_terms
          in: query
          description: term-node cap, kept by descending mention count
          schema: { type: integer, minimum: 1, maximum: 2000, default: 300 }
        - name: mentions_per_term
          in: query
          schema: { type: integer, minimum: 0, maximum: 50, default: 10 }
        - name: known_version
          in: query
          description: >-
            Client's last-seen graph version; when it still matches, the
            response is the tiny {version, unchanged, job_finished} form so
            live polling costs nothing between settlements.
          schema: { type: integer }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TranslationGraphSnapshot" }
        "404": { description: unknown job or not a translate job }
        "409":
          description: >-
            graph unavailable — job still starting, translation graph
            disabled for the run, or no result to rebuild from
  /translate/{jobId}/entries/{entryKey}:
    patch:
      summary: >
        Manual edit of one entry. The only write path a human translation
        takes, and the only one that involves no model: no provider, no
        api_key, and no network are required or consulted.
      parameters:
        - { $ref: "#/components/parameters/JobId" }
        - name: entryKey
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [translated_text]
              properties:
                translated_text: { type: string }
                file:
                  type: string
                  description: >
                    Source file of the entry. Required to address a key that
                    appears in more than one file; omitted, the engine edits
                    the first entry with that key.
                commit:
                  type: boolean
                  default: true
                  description: >-
                    true settles the entry (status becomes modified) and
                    appends a durable `commit` record to the session's edit
                    journal. false records a `draft` only: the journal keeps
                    the in-progress text so a crash cannot lose it, but the
                    entry itself is left untouched and nothing can ship.
                origin:
                  type: string
                  enum: [human, machine]
                  default: human
                  description: Stamped onto the entry; see Entry.origin.
                src_sha:
                  type: string
                  description: >-
                    sha256(source_text) truncated to 16 hex chars, as the
                    client saw it. Recorded on the entry so a later scan that
                    changes the source can mark the translation stale_source
                    instead of shipping it as if still valid. Omitted by
                    clients that predate the field, which yields an unknown
                    (not clean) staleness state.
                flagged:
                  type: boolean
                  description: Set or clear the revisit bookmark.
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "404": { description: unknown entry }
        "409": { description: translate job still running }
  /translate/{jobId}/entries/{entryKey}/retranslate:
    post:
      summary: >
        Re-translate one entry with the job's own model config (review
        screen "AI retranslate"). Synchronous - returns the updated entry
        (status becomes modified on success). 409 while the job is running;
        422 when the translator cannot be built or the retranslation of a
        previously passing entry fails validation.
      parameters:
        - { $ref: "#/components/parameters/JobId" }
        - name: entryKey
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                file:
                  type: string
                  description: >
                    Source file of the entry, to disambiguate a shared key.
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "409": { description: translate job still running }
        "422": { description: translator build or retranslation failure }
  /translate/{jobId}/entries/counts:
    get:
      summary: >
        One entry count per filter bucket, computed in a single pass. The
        review and manual screens need every bucket at once; fetching them
        as N separate filtered requests costs N full scans of the result.
      parameters:
        - { $ref: "#/components/parameters/JobId" }
        - name: search
          in: query
          description: Applied before counting, same semantics as /entries.
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: integer }
                description: Bucket name -> count, covering every filter value.
  /translate/{jobId}/entries/{entryKey}/context:
    get:
      summary: >
        Everything a human needs to translate one entry well. Involves no
        model and no network: siblings come from the numbered-key grouping,
        glossary from rule matching against this one source string, and TM
        from a local SQLite lookup. Available with no provider configured.
      parameters:
        - { $ref: "#/components/parameters/JobId" }
        - name: entryKey
          in: path
          required: true
          schema: { type: string }
        - name: file
          in: query
          description: Disambiguates a key shared by two files.
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntryContext" }
        "404": { description: unknown entry }
  /translate/{jobId}/validate:
    post:
      summary: >
        Validate one candidate translation against one entry's source.
        Synchronous, pure, no model and no network - this is the live
        feedback the manual editor calls as the user types. Returns the
        structured issue list rather than the flattened English message
        strings carried on Entry.errors, so a client can localize by
        issue_type and render severity separately.
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, translated_text]
              properties:
                key: { type: string }
                file: { type: string }
                translated_text: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [issues]
                properties:
                  issues:
                    type: array
                    items: { $ref: "#/components/schemas/ValidationIssue" }
        "404": { description: unknown entry }
  /translate/{jobId}/entries/{entryKey}/assist:
    post:
      summary: >
        Ask the model for help with one entry WITHOUT changing it. Returns
        candidate phrasings or an explanation; it never writes
        translated_text, never changes status, and never persists. The
        caller decides what, if anything, to accept. Contrast
        /retranslate, which overwrites the entry.
      parameters:
        - { $ref: "#/components/parameters/JobId" }
        - name: entryKey
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind:
                  type: string
                  enum: [suggest, alternatives, explain]
                file: { type: string }
                n:
                  type: integer
                  minimum: 1
                  maximum: 5
                  default: 3
                  description: Candidates wanted; ignored by `explain`.
                draft:
                  type: string
                  description: >-
                    The user's current text, when they want alternatives to
                    their own wording rather than to the model's.
                api_key:
                  type: string
                  description: >-
                    Required on a restored session: api_key is deliberately
                    not persisted in the session file, so a reopened session
                    has no credential until the client resupplies one.
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistResult" }
        "404": { description: unknown entry }
        "409": { description: translate job still running }
        "422": { description: assist call failed }
        "503":
          description: >-
            No usable provider is configured. Manual translation is
            unaffected; only this endpoint is unavailable.
  /placeholder/patterns:
    get:
      summary: >
        The engine's placeholder pattern list, in overlap-priority order.
        Served so a client can highlight and count tokens using the same
        definitions the validator enforces, instead of maintaining a second
        copy that drifts.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [patterns]
                properties:
                  patterns:
                    type: array
                    description: Earlier entries win an overlapping match.
                    items:
                      type: object
                      required: [name, regex]
                      properties:
                        name: { type: string }
                        regex: { type: string }
                        kind:
                          type: string
                          description: >-
                            Semantic token class the protector assigns
                            (ARG, VAR, TAG, BR, COLOR, RESET).
  /translate/{jobId}/stats:
    get:
      summary: Current pipeline counters after any review edits
      parameters:
        - { $ref: "#/components/parameters/JobId" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineStats" }
        "404": { description: unknown or non-translate job }
        "409": { description: translate result not available }
  /sessions:
    get:
      summary: List all persisted translation session records on disk
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SessionSummary" }
  /sessions/{sessionId}/restore:
    post:
      summary: Restore a persisted disk session into JobManager RAM
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { description: session not found }
  /sessions/{sessionId}/export:
    post:
      summary: Export a session to a .moru session file at specified path
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [output_path]
              properties:
                output_path: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [status, path]
                properties:
                  status: { type: string }
                  path: { type: string }
        "404": { description: session not found }
        "500": { description: export failed }
  /sessions/import:
    post:
      summary: Import an external .moru session file into persistent store and activate it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input_path]
              properties:
                input_path: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [status, session, job]
                properties:
                  status: { type: string }
                  session: { $ref: "#/components/schemas/SessionSummary" }
                  job: { $ref: "#/components/schemas/Job" }
        "404": { description: file not found }
        "422": { description: invalid session file format }
  /sessions/{sessionId}:
    delete:
      summary: >-
        Delete a persisted session from local disk store, together with its
        translate checkpoint (a deleted session is never offered for resuming)
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [status, id]
                properties:
                  status: { type: string }
                  id: { type: string }
        "404": { description: neither a session file nor a checkpoint exists }
        "409":
          description: >-
            the session file is in use (Windows: another request is reading
            it); retry. The checkpoint is removed first - or emptied in place
            when it cannot be unlinked - so the session is never offered for
            resuming again either way.
  /checkpoints:
    get:
      summary: Translate sessions that stopped early and can be resumed
      description: >-
        Listed from the per-session checkpoint files on disk, so a session
        interrupted by an app quit, a crash, a killed engine, a user cancel,
        a failure or an exhausted provider quota is still offered after the
        next launch. Each translate run that calls a provider appends every
        completed batch to its checkpoint (fsync per batch), so at most the
        in-flight batches are lost. A completed run removes its checkpoint;
        a fresh run with the same session_id replaces it. A run still live in
        this engine process is listed with state running. Resume with
        POST /jobs {type: translate, params: {session_id, resume: true,
        api_key?, api_base?, model?}}.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CheckpointSummary" }
  /checkpoints/{sessionId}:
    delete:
      summary: Discard a session's checkpoint (it can no longer be resumed)
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [status, id]
                properties:
                  status: { type: string }
                  id: { type: string }
        "404": { description: no checkpoint for this session }
        "409":
          description: >-
            the session's translate job is still running, or the checkpoint
            file can neither be unlinked nor emptied right now (retry)
  /glossary:
    get:
      summary: Glossary for a language pair
      parameters:
        - { name: source_lang, in: query, required: true, schema: { type: string } }
        - { name: target_lang, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Glossary" }
    put:
      summary: Replace user glossary entries
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Glossary" }
      responses:
        "200": { description: saved }
  /community/sync:
    post:
      summary: >
        Pull the latest published community snapshots from the web platform
        (web-api.yaml /api/tm/manifest + /api/glossary/manifest). TM entries
        merge into the local TM with origin=community under the "shared"
        version sentinel (they hit regardless of the per-run glossary
        fingerprint and outrank machine-cached rows); glossary snapshot
        entries map scope=vanilla to origin=vanilla rows (the engine no
        longer bundles a local vanilla glossary) and everything else to
        origin=community, replacing both origins in the user glossary
        store while manual/extracted rows survive. Every translate run
        merges the store. Unchanged versions are cheap no-ops.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [web_url, target_lang]
              properties:
                web_url: { type: string }
                source_lang: { type: string, default: en_us }
                target_lang: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  glossary:
                    type: object
                    nullable: true
                    description: null when the web has no published snapshot
                    properties:
                      version: { type: string }
                      terms: { type: integer }
                      updated: { type: boolean }
                  tm:
                    type: object
                    nullable: true
                    properties:
                      version: { type: string }
                      entries: { type: integer }
                      updated: { type: boolean }
        "502": { description: web platform unreachable or bad snapshot }
  /community/translation:
    get:
      summary: >
        Is a published community translation already covering this modpack?
        Asks web-api.yaml /api/translations/compatible with the identity of a
        finished scan job, then applies every compatibility rule locally,
        because only the engine knows the Minecraft version on disk and how
        much untranslated content the pack has. The scan's per-category entry
        counts are what let the answer quote coverage rather than a bare
        yes/no.
      description: >
        Never fails. Nothing published, a modpack with no usable identity, a
        web platform too old to serve the route, an unreachable network, a
        malformed body: every one of them is `match: null` with a 200. An
        optional lookup has nothing to tell the user when it does not work,
        and a wizard step that reddens because of one would be a regression.
        A 404 still means the job id is unknown, as everywhere else.
      parameters:
        - { name: web_url, in: query, required: true, schema: { type: string } }
        - name: job_id
          in: query
          required: true
          description: a finished scan job, or a translate job carrying its payload
          schema: { type: string }
        - { name: target_lang, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [match]
                properties:
                  match:
                    nullable: true
                    allOf: [{ $ref: "#/components/schemas/TranslationMatch" }]
        "404": { description: unknown job }
        "422": { description: invalid target_lang }
  /community/translation/download:
    post:
      summary: >
        Fetch a matched pack's archives for run-scoped A/B/C migration reuse.
      description: >
        Returns local ZIP paths suitable for the `previous_resourcepack_path`
        / `previous_overrides_path` job params. This is only the B side:
        whether any entry may actually be reused is still decided by the
        migration index, which requires the previous ORIGINAL modpack as A
        and reuses an entry only when its source text is byte-identical
        between A and the current pack. Supplying the downloaded artifacts
        without A is rejected by POST /jobs with a 422 — deliberately, since
        key-matching alone would apply a stale translation to English text
        that has since changed.

        Unlike the lookup this reports failure: the user pressed a button.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pack_id, download_url]
              properties:
                pack_id:
                  type: string
                  description: names the cache directory; not sent to the platform
                download_url:
                  type: string
                  description: TranslationMatch.download_url, kind-less
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  resourcepack_path: { type: string, nullable: true }
                  overrides_path: { type: string, nullable: true }
                description: >
                  Null for a channel this pack does not publish. Both null
                  means the pack had nothing downloadable.
        "422": { description: missing pack_id }
        "502": { description: download failed }
  /tm/stats:
    get:
      summary: Local translation-memory statistics
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries: { type: integer }
                  hits: { type: integer }
                  last_sync_version: { type: string, nullable: true }
  /providers:
    get:
      summary: Known providers/models and configured-key status
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Provider" }
  /providers/test:
    post:
      summary: Validate an API key with a minimal call
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider: { type: string }
                api_key: { type: string }
                model: { type: string }
                api_base: { type: string, nullable: true }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  error: { type: string, nullable: true }
  /providers/models:
    post:
      summary: >
        Live model list for one provider (LiteLLM ids). Falls back to the
        static catalog when the live fetch fails or returns nothing
        (source=static, error holds the failure reason). Unknown provider
        -> 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider: { type: string }
                api_key: { type: string, nullable: true }
                api_base: { type: string, nullable: true }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [provider, models, source, error]
                properties:
                  provider: { type: string }
                  models:
                    type: array
                    items: { type: string }
                  source: { type: string, enum: [live, static] }
                  error: { type: string, nullable: true }
        "404": { description: unknown provider }
  /config:
    get:
      summary: Engine config (API keys are stored by desktop via safeStorage, not here)
      responses:
        "200":
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
    put:
      summary: Update engine config
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: saved }
components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string }
  schemas:
    JobRequest:
      type: object
      required: [type, params]
      properties:
        type:
          type: string
          enum: [scan, translate, export, upload]
        params:
          type: object
          additionalProperties: true
          description: >
            scan: {modpack_path, source_locale?, target_locale?,
            previous_modpack_path?, previous_resourcepack_path?,
            previous_overrides_path?}. When any previous input is supplied,
            previous_modpack_path and at least one previous translation artifact
            are required. Paths accept local folders or ZIP files.
            translate: engine PipelineConfig surface - {modpack_path,
            output_dir?, source_locale?, target_locale?, model?, api_key?,
            api_base?, temperature?, reasoning_effort? (low|medium|high;
            LiteLLM thinking-effort passthrough, overriding the Ollama
            auto-disable), batch_size?, max_concurrent?,
            file_workers? (default: max_concurrent), max_refine?, use_tm?,
            use_vanilla_glossary?
            (include the server-synced origin=vanilla glossary store rows;
            no bundled vanilla data), extract_glossary?, glossary_max_terms?
            (positive integer; null removes the candidate limit),
            include_categories?, manual_seed?, seed_from_job_id?,
            scan_job_id?, previous_modpack_path?,
            previous_resourcepack_path?, previous_overrides_path?,
            session_id?, resume?}.
            session_id (UUID) becomes the job id, so a session keeps one id
            across runs; a live job with that id is refused (409). A run
            that calls a provider checkpoints every completed batch under
            its session id (see GET /checkpoints). Without resume a run
            starts over and discards that session's checkpoint. resume: true
            continues the session's checkpoint instead (404 when there is
            none): every other param comes from the checkpoint - only
            session_id, api_key, api_base and model are read from the request
            (model only to move a run off a provider that refused its login or
            was switched off) - the
            modpack is scanned afresh, translations whose source text is
            unchanged are reused without a provider call, only the remaining
            entries are sent, and the run then validates, writes the TM and
            generates outputs exactly like an uninterrupted run. Review edits
            made on the interrupted partial result - hand commits (PATCH
            .../entries/{key}) and AI retranslations - win over the
            checkpoint: they are kept as status modified and never re-sent
            (an AI retranslation only while its source text is unchanged).
            The session's scan-screen payload is kept with the checkpoint, so
            GET /scan/{jobId}/result still works for a session resumed after
            a relaunch. The checkpoint never stores api_key. A
            manual_seed run on the session discards its checkpoint as well.
            scan_job_id reuses a completed matching scan and its run-scoped
            migration index; it is only a hint - an unknown, unfinished or
            non-matching id is ignored and the run scans afresh.
            Translated runs always generate plain and bilingual variants;
            source-text-only runs omit the redundant bilingual trees.
            include_categories
            limits translation to the named scan categories (default all).
            manual_seed: true seeds a hand-translation session - the run
            makes no provider call and needs no api_key, and every entry it
            would otherwise translate is left untranslated with status
            pending, so the manual screen can distinguish "not yet touched"
            from "translated". Unlike a source-text export it does NOT
            disable the LLM-free helper stages: TM, the vanilla and user
            glossaries, mod-translation harvest and the sibling graph all
            still run, because only glossary curation needs a model.
            seed_from_job_id adopts an earlier job's human translations
            (origin=human) as already-settled, so an automatic run over a
            partially hand-translated pack never re-translates and never
            overwrites the human work.
            export: {translate_job_id, output_zip?}; accepts a completed,
            user-cancelled or interrupted translate job whose partial result
            is available.
            Or, for the W3 "export as source text" action,
            {source_text: true, modpack_path, source_locale?,
            target_locale?, include_categories?, output_dir?, output_zip?} -
            no translate job, model, or api_key is involved: the engine
            extracts the pack and drives the same pipeline and output
            generator with every entry settled to its own source string, so
            the archives carry a translated export's exact layout with the
            untranslated text as their values.
            upload: {translate_job_id, modpack_name, web_url? (default
            https://moru.gg), api_token? (Bearer token for the web platform;
            omitted = anonymous desktop upload, attributed to no account),
            modpack_version?, description?, changelog?, share_mods? (default
            true), curseforge_id? (positive integer; forwarded verbatim so
            the web platform can link the pack to its CurseForge project)}.
            Publishes reviewed resource pack and override archives in both
            variants, skipping empty trees. The whole modpack is registered
            first; per-mod packs require api_token and use grouped upload
            slots and /api/translations/batch in chunks of at most 100 mods,
            with six concurrent archive PUTs. Identity lookup is awaited for
            at most 120 seconds. The whole registration includes
            mod_pack_count and is_manual_translation for manual-seed runs.
            The terminal done frame follows UploadResult.
    ModSources:
      type: object
      required: [status, total, resolved, unresolved, sources]
      properties:
        status: { type: string, enum: [pending, running, done, failed] }
        total: { type: integer, minimum: 0 }
        resolved: { type: integer, minimum: 0 }
        unresolved: { type: integer, minimum: 0 }
        sources:
          type: array
          items:
            type: object
            required: [jar_name, project_id, file_id, source]
            properties:
              jar_name: { type: string }
              project_id: { type: integer, nullable: true }
              file_id: { type: integer, nullable: true }
              source: { type: string, enum: [instance, prism, fingerprint, unresolved] }
    ExportResult:
      type: object
      required: [zip_path, overrides_zip_path, bilingual_zip_path, bilingual_overrides_zip_path, file_count]
      properties:
        zip_path: { type: string, nullable: true }
        overrides_zip_path: { type: string, nullable: true }
        bilingual_zip_path: { type: string, nullable: true }
        bilingual_overrides_zip_path: { type: string, nullable: true }
        file_count: { type: integer, minimum: 0 }
    UploadResult:
      type: object
      required: [pack_id, url, mod_packs]
      properties:
        pack_id: { type: string }
        url: { type: string }
        modpack_slug: { type: string }
        bundle_url: { type: string, description: Not emitted by the engine }
        mod_packs:
          type: object
          required: [shared, skipped, failed]
          properties:
            shared: { type: integer, minimum: 0 }
            skipped: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0 }
            skipped_reason: { type: string, enum: [login_required, disabled, unresolved] }
            bundle_url: { type: string, description: Not emitted by the engine }
    Job:
      type: object
      required: [id, type, status]
      properties:
        id: { type: string }
        type: { type: string, enum: [scan, translate, export, upload] }
        status:
          type: string
          enum: [pending, running, done, failed, cancelled, interrupted]
          description: >-
            interrupted (translate only): stopped early but resumable - the
            provider ran out of capacity, or the engine shut down mid-run.
            Partial results stay reviewable like cancelled ones.
        error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    JobSnapshot:
      type: object
      required: [job, cursor, events, failed_count, translation_started_at]
      properties:
        job: { $ref: "#/components/schemas/Job" }
        cursor: { type: integer, minimum: 0 }
        events:
          type: array
          items:
            type: object
            required: [type, seq, emitted_at]
            additionalProperties: true
            properties:
              type: { type: string }
              seq: { type: integer, minimum: 1 }
              emitted_at:
                type: integer
                description: engine wall-clock epoch milliseconds
        failed_count: { type: integer, minimum: 0 }
        translation_started_at:
          type: integer
          nullable: true
          description: epoch milliseconds of the first provider batch
    ScanResult:
      type: object
      description: >
        Source files with untranslated target-locale entries, grouped by
        category. entry_count/char_count and samples exclude keys that already
        have a non-empty target value. Parser failures remain visible with zero
        volumes instead of being treated as fully translated. Migration scans
        additionally report exact A/B/C matches per file and in the nullable
        top-level migration summary.
      properties:
        modpack_path: { type: string }
        categories:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              handler: { type: string }
              file_count: { type: integer }
              entry_count: { type: integer }
              char_count: { type: integer }
              files:
                type: array
                items:
                  type: object
                  properties:
                    path: { type: string }
                    entry_count: { type: integer }
                    char_count: { type: integer }
                    migration_entry_count:
                      type: integer
                      description: exact A/B/C matches that skip translation
                    migration_char_count:
                      type: integer
                      description: source characters covered by those matches
                    sample:
                      type: object
                      additionalProperties: { type: string }
                      description: up to 3 entries, values truncated to 160 chars
        migration:
          type: object
          nullable: true
          description: null for a normal scan without previous-version inputs
          properties:
            entry_count: { type: integer }
            char_count: { type: integer }
            resourcepack_asset_count:
              type: integer
              description: non-translation files preserved from the old resource pack
        identity:
          type: object
          description: >
            Launcher-metadata pack identity (CurseForge app instance,
            CurseForge export manifest, Modrinth pack index, Prism/MultiMC
            instance config), used to prefill the upload form and link the
            pack to its upstream project. Always present; confident=false
            means only the folder name was available.
          properties:
            name: { type: string, nullable: true }
            version: { type: string, nullable: true }
            mc_version: { type: string, nullable: true }
            loader:
              type: string
              nullable: true
              description: forge | neoforge | fabric | quilt
            curseforge_project_id: { type: integer, nullable: true }
            curseforge_file_id: { type: integer, nullable: true }
            modrinth_project_id: { type: string, nullable: true }
            modrinth_version_id: { type: string, nullable: true }
            source:
              type: string
              enum:
                [
                  curseforge_instance,
                  curseforge_manifest,
                  modrinth_pack,
                  prism_managed,
                  prism_instance,
                  folder,
                ]
            confident: { type: boolean }
    TranslationMatch:
      type: object
      description: >
        A published community pack offered for the scanned modpack. The
        version match only decides candidacy; what the user acts on is
        `uncovered_entries`. Measured over 11,513 real published modpack
        versions, a declared range carries a translation across only ~25% of
        real updates, because most version strings are not orderable
        releases at all — so the coverage report, not the range, is what
        makes offering a non-exact match worth anything.
      required: [pack_id, exact, uncovered_by_category, note]
      properties:
        pack_id: { type: string }
        modpack_version: { type: string, nullable: true }
        exact:
          type: boolean
          description: >
            The pack was built for this modpack version. The only thing that
            matched before ranges existed, and today the only thing that can
            match at all: the platform records no per-pack Minecraft version,
            and the engine refuses a range whose Minecraft boundary it could
            not check on both sides.
        compatible_versions:
          type: object
          nullable: true
          description: inclusive range the pack's author declared, if any
          properties:
            min: { type: string }
            max: { type: string }
        total_entries: { type: integer, nullable: true }
        uncovered_entries:
          type: integer
          nullable: true
          description: >
            LOWER BOUND on local source entries this translation does not
            cover. Null when the local side was not measured; 0 means no
            missing entry could be established, which is as far as counts
            go. Deliberately never a percentage — only a key-level diff of
            the downloaded pack could justify one.
        uncovered_by_category:
          type: object
          additionalProperties: { type: integer }
          description: >
            The same figure per scan category, fully-covered categories
            dropped, so a category that shrank cannot mask one that grew.
            Collapses to a single "" bucket when the two sides name their
            categories differently, which is the normal case.
        url: { type: string, nullable: true }
        download_url:
          type: string
          nullable: true
          description: pass to /community/translation/download
        note:
          type: string
          description: user-facing Korean summary of what matched and what it costs
    Entry:
      type: object
      required: [key, source_text, translated_text, status]
      properties:
        key: { type: string }
        file: { type: string }
        source_text: { type: string }
        translated_text: { type: string }
        status:
          type: string
          description: >-
            `pending` is a seeded, not-yet-touched entry produced by a
            manual-seed run; it is deliberately outside the set that feeds
            the resource pack, so an untranslated entry can never ship.
          enum:
            [
              passed,
              warning,
              failed,
              modified,
              tm_hit,
              migrated,
              skipped,
              pending,
            ]
        errors:
          type: array
          items: { type: string }
        origin:
          type: string
          nullable: true
          description: >-
            Who produced `translated_text`. `human` is set only by a manual
            edit (PATCH); `machine` by a model run or AI retranslate. Absent
            on entries written before this field existed.
          enum: [machine, human, tm, community]
        flagged:
          type: boolean
          default: false
          description: Bookmarked by a hand translator to revisit.
        stale_source:
          type: boolean
          default: false
          description: >-
            The entry carries a human translation whose recorded source hash
            no longer matches the scanned source text: the modpack changed
            the string underneath it. The translation is kept, never
            discarded, but export is blocked until the user confirms it.
    EntryPage:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        entries:
          type: array
          items: { $ref: "#/components/schemas/Entry" }
    ValidationIssue:
      type: object
      required: [issue_type, severity, message]
      properties:
        issue_type:
          type: string
          description: >-
            Stable machine-readable code. Prefer switching on this over
            parsing `message`, which is English-only and unlocalized.
          enum:
            [
              key_mismatch,
              empty_translation,
              untranslated,
              placeholder_count,
              placeholder_order,
              color_code,
              length_ratio,
              glossary_term_mismatch,
              glossary_noun_mismatch,
              format_string,
            ]
        severity: { type: string, enum: [error, warning, info] }
        key: { type: string }
        message: { type: string, description: English, not localized. }
        suggestion: { type: string, nullable: true }
        source_value: { type: string, nullable: true }
        translated_value: { type: string, nullable: true }
    EntryContext:
      type: object
      description: >-
        Per-entry translation aids. Every field is derived without a model
        or a network call.
      required: [file, siblings, glossary, tm, placeholders]
      properties:
        mod_id: { type: string, nullable: true }
        namespace: { type: string, nullable: true }
        content_type:
          type: string
          nullable: true
          description: Handler name that owns the file (ftbquests, patchouli, ...).
        file: { type: string }
        siblings:
          type: array
          description: >-
            The entry's numbered-key run, in ordinal order, excluding the
            entry itself. Mods routinely split one sentence across
            tooltip1..tooltipN, so these must be visible while translating.
          items:
            type: object
            required: [key, source_text, status]
            properties:
              key: { type: string }
              source_text: { type: string }
              translated_text: { type: string, nullable: true }
              status: { type: string }
        glossary:
          type: object
          description: >-
            Only the rules that apply to this entry, resolved by matching
            against BOTH the source string and the entry's real lang key:
            rules whose key_scope misses this key are already dropped, so a
            client renders what it is given without re-filtering.
          properties:
            terms:
              type: array
              items:
                type: object
                properties:
                  aliases: { type: array, items: { type: string } }
                  term_ko: { type: string }
                  preferred_style: { type: string, nullable: true }
                  key_scope:
                    type: array
                    items: { type: string }
                    description: >-
                      Surfaced so the UI can show WHY a rule applies here
                      (e.g. "적용 키: effect.*") rather than presenting a
                      narrowly scoped rule as a global one.
            proper_nouns:
              type: array
              items:
                type: object
                properties:
                  source_like: { type: string }
                  preferred_ko: { type: string }
            formatting:
              type: array
              description: >-
                Prose-only guidance. These rules carry no machine-checkable
                assertion and are never validated - display them, do not
                imply enforcement.
              items:
                type: object
                properties:
                  rule_name: { type: string }
                  description: { type: string }
        tm:
          type: object
          properties:
            exact:
              nullable: true
              type: object
              properties:
                translated_text: { type: string }
                origin: { type: string }
                updated_at: { type: string, nullable: true }
            same_source_elsewhere:
              type: array
              description: >-
                Other entries in this job with a byte-identical source that
                already have a translation. Disagreement here is the
                consistency bug a hand translator most wants surfaced.
              items:
                type: object
                properties:
                  file: { type: string }
                  key: { type: string }
                  translated_text: { type: string }
                  agrees: { type: boolean }
        placeholders:
          type: array
          items:
            type: object
            properties:
              token: { type: string }
              kind: { type: string }
              literal: { type: string }
    AssistResult:
      type: object
      description: Advisory only. Nothing here has been written to the entry.
      required: [kind, suggestions]
      properties:
        kind: { type: string, enum: [suggest, alternatives, explain] }
        model: { type: string, nullable: true }
        elapsed_ms: { type: integer }
        suggestions:
          type: array
          items:
            type: object
            required: [text]
            properties:
              text: { type: string }
              note: { type: string, nullable: true }
        explanation: { type: string, nullable: true }
    TranslationGraphSnapshot:
      type: object
      description: >-
        Either the full snapshot or, when known_version matched, the
        {version, unchanged, job_finished} short form.
      required: [version, job_finished]
      properties:
        version: { type: integer }
        job_finished: { type: boolean }
        unchanged: { type: boolean }
        truncated: { type: boolean }
        stats:
          type: object
          properties:
            entries: { type: integer }
            terms: { type: integer }
            mentions: { type: integer }
            sibling_groups: { type: integer }
        nodes:
          type: array
          items:
            type: object
            required: [id, kind, label, settled]
            properties:
              id: { type: string }
              kind: { type: string, enum: [term, entry] }
              label: { type: string }
              settled: { type: boolean }
              target: { type: string, nullable: true }
              category: { type: string }
              definers: { type: integer }
              mentions: { type: integer }
              file: { type: string }
        edges:
          type: array
          items:
            type: object
            required: [source, target, kind]
            properties:
              source: { type: string }
              target: { type: string }
              kind: { type: string, enum: [defines, mentions, sibling] }
    PipelineStats:
      type: object
      required:
        [
          total_files,
          total_entries,
          translated_entries,
          failed_entries,
          tm_hits,
          migration_hits,
          skipped_entries,
          coverage_percent,
          quality_score,
        ]
      properties:
        total_files: { type: integer }
        total_entries: { type: integer }
        translated_entries: { type: integer }
        failed_entries: { type: integer }
        tm_hits: { type: integer }
        migration_hits: { type: integer }
        skipped_entries: { type: integer }
        categories:
          type: object
          additionalProperties: { type: integer }
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        cached_tokens: { type: integer }
        duration_seconds: { type: number }
        coverage_percent: { type: number }
        quality_score: { type: number }
    Glossary:
      type: object
      properties:
        source_lang: { type: string }
        target_lang: { type: string }
        terms:
          type: array
          items:
            type: object
            required: [source, target]
            properties:
              source: { type: string }
              target: { type: string }
              origin: { type: string, enum: [vanilla, extracted, manual, community] }
              key_scope:
                type: array
                items: { type: string }
                description: >-
                  Dotted lang-key globs limiting where the rule applies.
                  Each segment is a literal or `*`; a trailing `*` absorbs
                  every remaining segment. `effect.minecraft.wither` is one
                  exact key, `effect.*` the whole namespace including modded
                  keys, `subtitles.*.wither` one wildcard segment in the
                  middle. Empty or absent = unscoped, applying to every key.
                  Precedence is per key: when a scoped rule claims a key, an
                  unscoped rule for the same term is dropped for that key.
    Provider:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        models:
          type: array
          items: { type: string }
        has_key:
          type: boolean
          description: >-
            Ready to use. An API key is configured, or — when auth is "cli" —
            the user's coding CLI is logged in and its grant is readable.
        auth:
          type: string
          enum: [cli]
          description: >-
            Present only for coding-CLI subscriptions (Claude Code, OpenAI
            Codex, Gemini CLI), which authenticate off the CLI's own OAuth
            grant and never take an API key.
        connected: { type: boolean }
        disabled:
          type: boolean
          description: >-
            Present and true for a provider switched off in this build. It is
            listed so a saved selection can explain itself, but is never
            probed, and POST /jobs refuses a translate run on it (422).
        login_hint:
          type: string
          nullable: true
          description: Shell command that authenticates the CLI, e.g. "claude login".
        account: { type: string, nullable: true }
    SessionSummary:
      type: object
      required: [id, modpack_name, modpack_path, source_locale, target_locale, model, status, total_entries, done_entries]
      properties:
        id: { type: string }
        modpack_name: { type: string }
        modpack_path: { type: string }
        source_locale: { type: string }
        target_locale: { type: string }
        model: { type: string }
        status: { type: string }
        created_at: { type: string, nullable: true }
        finished_at: { type: string, nullable: true }
        total_entries: { type: integer }
        done_entries: { type: integer }
        stats: { type: object, nullable: true }
        export_zip_path: { type: string, nullable: true }
        export_overrides_zip_path: { type: string, nullable: true }
        export_bilingual_zip_path: { type: string, nullable: true }
        export_bilingual_overrides_zip_path: { type: string, nullable: true }
    CheckpointSummary:
      type: object
      required: [session_id, modpack_path, modpack_name, source_locale, target_locale, model, created_at, updated_at, state, reason, error, translated_entries, total_entries]
      properties:
        session_id: { type: string }
        modpack_path: { type: string }
        modpack_name: { type: string }
        source_locale: { type: string }
        target_locale: { type: string }
        model: { type: string }
        created_at: { type: string, nullable: true, description: first run start (ISO 8601) }
        updated_at: { type: string, nullable: true, description: last record written (ISO 8601) }
        state:
          type: string
          enum: [running, interrupted, cancelled, failed]
          description: >-
            running: the job is live in this engine process. interrupted
            with reason null: the process stopped (quit, crash, kill) before
            the run could record why.
        reason:
          type: string
          nullable: true
          enum: [quota, auth, shutdown, null]
        error: { type: string, nullable: true }
        translated_entries:
          type: integer
          minimum: 0
          description: >-
            Entries already settled for the run - reused at prepare time (TM,
            previous translation, earlier checkpoint) or translated by a
            checkpointed batch. A resume does not send these to the provider.
        total_entries:
          type: integer
          nullable: true
          description: >-
            Entries needing a translation in the run's scope; null until a
            run of the session finished preparing its files.
security:
  - sessionToken: []
