openapi: "3.1.0"
info:
  title: Moru Web API (desktop <-> web public contract)
  description: >
    Single source of truth for the desktop app <-> moru.gg contract.
    moru-web keeps a copy at docs/web-api.yaml synchronized by the
    contract_version tag. Prefer additive changes (new fields, new
    endpoints) because auto-update lag keeps old desktop builds alive.
    Contract v3: uploads accept either an authenticated caller (session
    cookie or desktop API token) or an anonymous desktop-engine call
    carrying the X-Moru-Client marker header; browser-anonymous calls
    (no session, no marker) are rejected with 401.
    Contract v4 adds the bilingual artifact kinds
    (resource_pack_bilingual, overrides_bilingual): the same translation
    run rendered with the original English kept in parentheses after each
    short display name. They are optional and purely additive - a v3
    desktop client that uploads only resource_pack / overrides stays fully
    supported, the server keeps the old two kinds unchanged and stores the
    new ones in separate nullable columns. Pack downloads select a variant
    with `?variant=plain|bilingual`; an absent variant means plain, so
    every download URL minted before v4 keeps serving the same bytes.
    Contract v5 adds `key_scope` to glossary snapshot entries (see
    GlossarySnapshotEntry): the dotted-glob lang keys a rule is allowed to
    fire on. It is additive in both directions - an absent or empty
    `key_scope` means the rule applies to every key, exactly as every rule
    did before v5, so snapshots published earlier stay valid and older
    engine builds that ignore the field keep behaving as they do today.
    The snapshot body shapes, previously implicit, are now spelled out as
    GlossarySnapshotEntry and TmSnapshotEntry.
    Contract v6 adds GET /api/translations/compatible: the published
    translations for one modpack in one language, so the desktop can tell
    a user a translation already exists before they pay to make another.
    Purely additive and read-only. The endpoint makes no compatibility
    decision - it reports what is published and the engine judges fit,
    because only the desktop side knows the Minecraft version installed
    and how much untranslated content the local pack has. Candidates
    therefore omit `mc_version` and `compatible_versions`: nothing in the
    platform records either per translation pack, and a guessed value
    would let the engine honour a declared range it must not trust. An
    absent Minecraft version caps a candidate at exact-version matching,
    which is the fail-closed default.
    Contract v7 adds authenticated single-mod translations, grouped upload
    URLs and desktop batch registration. Modpack Index supplies mod lists
    for browser-assembled bundles; bundle downloads return presigned R2 GET
    URLs without proxying archive bytes. CurseForge search and file/version
    metadata use a one-hour upstream Data Cache.
  version: "0.7.0"
  x-contract-version: 7
servers:
  - url: "https://moru.gg"
paths:
  /api/upload-url:
    post:
      summary: Issue presigned R2 upload URLs for pack archives
      description: >
        Signed-in callers (web session or desktop API Bearer token) always
        pass. Anonymous callers pass only when the request carries the
        desktop client marker header `X-Moru-Client: moru-engine/<version>`
        — the website upload form stays sign-in only. Other anonymous
        calls are rejected with 401.
        Files sharing a group share one translations/{uuid} prefix.
        Ungrouped files share a separate prefix, as before. Without groups
        the maximum is five files; with any group the maximum is 200 and
        only archive kinds are allowed.
      security: [{ apiToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [kind, size, sha256]
                    properties:
                      kind:
                        type: string
                        enum:
                          - resource_pack
                          - overrides
                          - resource_pack_bilingual
                          - overrides_bilingual
                        description: >
                          overrides = plain text override files layered onto
                          the modpack instance folder (kubejs/, ftbquests/,
                          config/ ...). Uploading mod .jar files is a ToS
                          violation (mod redistribution) and is not accepted.
                          The `_bilingual` kinds are the same two trees with
                          the original English kept in parentheses after each
                          short display name ("철 곡괭이 (Iron Pickaxe)"), so
                          recipe viewers and in-game search match either
                          spelling. They are optional: a single request may
                          ask for one archive or all four.
                      size: { type: integer }
                      sha256: { type: string }
                      group:
                        type: string
                        minLength: 1
                        maxLength: 100
                        description: Optional per-mod grouping key; echoed in uploads.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploads:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string }
                        url: { type: string, description: presigned PUT URL }
                        object_key: { type: string }
                        group: { type: string, description: Present when supplied for this file }
  /api/translations:
    post:
      summary: Register uploaded pack metadata (after presigned upload completes)
      description: >
        Same authentication policy as /api/upload-url: web session,
        desktop API Bearer token, or the anonymous desktop-engine call
        with the X-Moru-Client marker. Signed-in packs are registered
        under the calling user; anonymous desktop packs are attributed
        to no account. Supplying pack_id appends a version to that pack
        instead of creating another TranslationPack and requires its
        owner (or an admin).
        project_kind defaults to modpack. Single-mod registrations require
        a signed-in caller and CurseForge project id, accept only resource
        packs (plain/bilingual), and record the mod file's MC versions and
        loader. Without pack_id, the same project, normalized version,
        languages and owner revise the existing published pack. Omitted
        artifact slots always carry forward. Mod registrations announce
        individually but never auto-fulfill modpack requests.
      security: [{ apiToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TranslationPackCreate" }
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  pack_id: { type: string }
                  url: { type: string, description: public pack page }
                  modpack_slug: { type: string }
                  project_kind: { type: string, enum: [modpack, mod] }
        "400": { description: invalid registration metadata or file kinds }
        "401": { description: authentication required, including anonymous desktop mod registrations }
        "403":
          description: pack_id is not owned by the caller
  /api/translations/compatible:
    get:
      summary: Published translations for one modpack (desktop pre-translation check)
      description: >
        Unauthenticated. Narrows by CurseForge id when the caller has one
        and by modpack name otherwise; at least one of the two is
        required. Returns every published pack for that modpack in the
        requested language that still has a downloadable artifact.
        Compatibility is NOT decided here - the engine applies every rule
        itself, because only the desktop knows the Minecraft version on
        disk and how much untranslated content the local pack has.
        Nothing found is an empty candidates array with a 200, never a
        404: a transport failure means "try later" while an empty list
        means "nobody has translated this", and the engine must be able
        to tell them apart.
        Only project_kind=modpack projects are searched; single-mod
        translations do not appear in these results.
      parameters:
        - { name: target_lang, in: query, required: true, schema: { type: string, example: ko_kr } }
        - { name: modpack_name, in: query, schema: { type: string } }
        - { name: curseforge_id, in: query, schema: { type: integer } }
        - name: modpack_version
          in: query
          description: >
            Only orders the result: an exact match is placed first so the
            per-modpack cap can never truncate it away.
          schema: { type: string }
        - name: mc_version
          in: query
          description: >
            Accepted and ignored for this modpack-only lookup. Minecraft
            compatibility is stored only on single-mod translations.
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [candidates]
                properties:
                  candidates:
                    type: array
                    items: { $ref: "#/components/schemas/CompatibleTranslation" }
        "400": { description: unsupported target_lang, or neither curseforge_id nor modpack_name }
        "429": { description: rate limited }
  /api/translations/batch:
    post:
      summary: Register up to 100 signed-in desktop per-mod translations
      description: >
        Requires a session or desktop API token; an anonymous desktop marker
        is insufficient. Rate limited to 30 requests/hour per account.
        Unknown projects are enriched through CurseForge batch lookups in
        chunks of 50. Each mod follows the same revision/artifact retention
        semantics as /api/translations. No announcements or request
        auto-fulfillment; the owner's score is recomputed once per batch.
        Individual failures do not roll back successful mods.
      security: [{ apiToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModTranslationBatch" }
      responses:
        "201":
          description: Per-mod registration outcomes
          content:
            application/json:
              schema:
                type: object
                required: [packs, failed]
                properties:
                  packs:
                    type: array
                    items:
                      type: object
                      required: [curseforge_id, pack_id, url]
                      properties:
                        curseforge_id: { type: integer }
                        pack_id: { type: string }
                        url: { type: string }
                  failed:
                    type: array
                    items:
                      type: object
                      required: [curseforge_id, error]
                      properties:
                        curseforge_id: { type: integer }
                        error: { type: string }
        "400": { description: invalid batch metadata or mod ids }
        "401": { description: authentication required }
        "429": { description: rate limited }
  /api/modpacks/search:
    get:
      summary: Search CurseForge Minecraft modpacks (class 4471)
      description: Upstream search responses are cached for one hour.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
      responses:
        "200":
          description: Ranked CurseForge projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/CurseForgeSearchResult" }
        "400": { description: invalid q }
        "429": { description: rate limited }
        "503": { description: search unavailable }
  /api/mods/search:
    get:
      summary: Search CurseForge Minecraft mods (class 6)
      description: Same result shape as modpack search; cached upstream for one hour.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
      responses:
        "200":
          description: Ranked CurseForge mod projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/CurseForgeSearchResult" }
        "400": { description: invalid q }
        "429": { description: rate limited }
        "503": { description: search unavailable }
  /api/modpacks/{id}/versions:
    get:
      summary: Selectable files for any CurseForge mod or modpack project
      description: >
        Upstream files and Minecraft versions are cached for one hour.
        Only available non-server, non-child files are offered, newest first.
        game_version restricts results to files containing that MC version.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: game_version, in: query, schema: { type: string, example: "1.20.1" } }
      responses:
        "200":
          description: Selectable CurseForge releases
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions:
                    type: array
                    items:
                      type: object
                      properties:
                        fileId: { type: integer }
                        version: { type: string }
                        fileName: { type: string }
                        fileDate: { type: string, format: date-time }
                        releaseType: { type: integer }
                        minecraftVersions: { type: array, items: { type: string } }
                        loader: { type: [string, "null"], enum: [forge, neoforge, fabric, quilt, null] }
        "400": { description: invalid id }
        "429": { description: rate limited }
        "503": { description: versions unavailable }
  /api/curseforge/minecraft-versions:
    get:
      summary: Minecraft versions for the upload selector
      description: Upstream metadata is cached for one hour.
      responses:
        "200":
          description: Version strings reported by CurseForge
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions: { type: array, items: { type: string } }
        "429": { description: rate limited }
        "503": { description: versions unavailable }
  /api/mods/modpack-search:
    get:
      summary: Search Modpack Index for a bundle's modpack
      description: >
        Unauthenticated, limited to 60 requests/hour per IP. Modpack Index
        requests carry the moru.gg User-Agent and are cached for one hour.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
      responses:
        "200":
          description: Modpack Index search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/ModpackIndexSummary" }
        "400": { description: invalid q }
        "429": { description: rate limited }
        "503": { description: search unavailable }
  /api/bundles/download:
    post:
      summary: Sign selected mod translation archives for browser assembly
      description: >
        Only published mod packs are eligible. Missing/rejected/non-mod packs
        and packs without a resource archive are skipped. A missing bilingual
        variant falls back to plain via the pack's available variants. URLs
        expire in 300 seconds; browser GET downloads require R2 CORS permitting
        GET and range from the site origins. No archive bytes pass through
        Vercel. Duplicate ids are removed while preserving requested order.
        Each included pack's download and parent counter increment together,
        at most once per IP/day using the same dl:pack:{id}:{ip} key as direct
        downloads. Only owners crossing a download-point block are rescored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pack_ids, variant]
              properties:
                pack_ids:
                  type: array
                  minItems: 1
                  maxItems: 400
                  items: { type: string, minLength: 1, maxLength: 100 }
                variant: { type: string, enum: [plain, bilingual] }
      responses:
        "200":
          description: Presigned files in requested order and unavailable pack ids
          content:
            application/json:
              schema:
                type: object
                required: [files, skipped]
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      required: [pack_id, url, file_name]
                      properties:
                        pack_id: { type: string }
                        url: { type: string, description: Presigned R2 GET URL }
                        file_name:
                          type: string
                          description: "{modName}-{modVersion}-{lang}[-bilingual].zip (actual variant)"
                  skipped: { type: array, items: { type: string } }
        "400": { description: invalid ids or variant }
        "500": { description: signing or download accounting failed }
  /api/export/corrections:
    get:
      summary: Approved corrections for evalset building (operator token required)
      security: [{ apiToken: [] }]
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: lang
          in: query
          schema: { type: string, example: ko_kr }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  corrections:
                    type: array
                    items:
                      type: object
                      required: [entry_key, source_text, previous_text, corrected_text, resolved_at]
                      properties:
                        pack_id: { type: string }
                        entry_key: { type: string }
                        source_text: { type: string }
                        previous_text: { type: string }
                        corrected_text: { type: string }
                        target_lang: { type: string }
                        resolved_at: { type: string, format: date-time }
  /api/tm/manifest:
    get:
      summary: >
        Shared-TM snapshot manifest (few KB, edge-cached, ETag). The snapshot
        body is downloaded directly from R2 - it never passes through Vercel.
      description: >
        The manifest only locates the snapshot; `url` serves a gzip JSON
        array of TmSnapshotEntry.
      parameters:
        - { name: lang, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotManifest" }
        "304": { description: not modified }
  /api/glossary/manifest:
    get:
      summary: Approved community glossary snapshot manifest (same pattern as TM)
      description: >
        The manifest only locates the snapshot; `url` serves a gzip JSON
        array of GlossarySnapshotEntry, whose `key_scope` restricts a rule
        to specific lang keys while `scope` only records where the rule
        came from.
      parameters:
        - { name: lang, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotManifest" }
        "304": { description: not modified }
  /auth/desktop-login:
    get:
      summary: >
        Browser entry point for desktop login. Runs Discord OAuth, then
        redirects to http://127.0.0.1:{port}/callback with a desktop API token.
      security: []
      parameters:
        - { name: port, in: query, required: true, schema: { type: integer } }
      responses:
        "302": { description: redirect into OAuth flow }
components:
  securitySchemes:
    apiToken:
      type: http
      scheme: bearer
      description: Desktop API token issued via /auth/desktop-login
  schemas:
    CurseForgeSearchResult:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        summary: { type: string }
        logoUrl: { type: [string, "null"] }
        author: { type: [string, "null"] }
        downloads: { type: number }
        gameVersions: { type: [string, "null"], description: Comma-separated MC versions }
        url: { type: [string, "null"] }
    ModpackIndexSummary:
      type: object
      required: [id, name, slug, summary, thumbnailUrl, curseforgeId, downloads]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        summary: { type: string }
        thumbnailUrl: { type: [string, "null"] }
        curseforgeId: { type: [integer, "null"] }
        downloads: { type: number }
    MinecraftVersions:
      type: array
      minItems: 1
      maxItems: 20
      items: { type: string, pattern: '^\d+(\.\d+){1,2}(-[\w.]+)?$' }
    ModResourceFile:
      type: object
      required: [kind, object_key]
      properties:
        kind: { type: string, enum: [resource_pack, resource_pack_bilingual] }
        object_key: { type: string }
    ModTranslationBatch:
      type: object
      required: [modpack_name, target_lang, engine_version, mods]
      properties:
        modpack_curseforge_id: { type: integer, minimum: 1 }
        modpack_name: { type: string, minLength: 1, maxLength: 200 }
        modpack_version: { type: string, maxLength: 100 }
        target_lang: { type: string, example: ko_kr }
        source_lang: { type: string, default: en_us }
        engine_version: { type: string, minLength: 1, maxLength: 50 }
        is_manual_translation: { type: boolean }
        mods:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [curseforge_id, game_versions, files, stats]
            properties:
              curseforge_id: { type: integer, minimum: 1 }
              curseforge_file_id: { type: integer, minimum: 1 }
              name: { type: string, maxLength: 200 }
              version: { type: string, maxLength: 100 }
              game_versions: { $ref: "#/components/schemas/MinecraftVersions" }
              loader: { type: string, maxLength: 30 }
              files:
                type: array
                minItems: 1
                maxItems: 2
                items: { $ref: "#/components/schemas/ModResourceFile" }
              stats: { $ref: "#/components/schemas/PackStats" }
    PackStats:
      type: object
      properties:
        total_entries: { type: integer }
        translated_entries: { type: integer }
        failed_entries: { type: integer }
        coverage_percent: { type: number }
        quality_score: { type: number, description: validator pass rate 0-1 }
        tm_hits: { type: integer }
        categories:
          type: object
          additionalProperties: { type: integer }
        model: { type: string }
        duration_seconds: { type: number }
    CompatibleTranslation:
      type: object
      description: >
        One published pack offered as a candidate by
        /api/translations/compatible. Every field describes what WAS
        published; none of them asserts that the pack fits the caller's
        modpack. Two fields the engine knows how to read are deliberately
        never emitted, because the platform records neither per pack:
        `mc_version` and `compatible_versions`. Emitting a guess would be
        worse than omitting them - a Minecraft version the engine can
        compare on both sides is exactly the gate that lets a NON-exact
        modpack version through on a declared range, so a wrong value
        turns a safe miss into a wrong offer. Absent, the engine caps the
        candidate at exact-version matching.
      required: [pack_id, modpack_version, url, download_url]
      properties:
        pack_id: { type: string }
        modpack_version:
          type: string
          description: the modpack version this translation was built for
        total_entries:
          type: integer
          nullable: true
          description: entries the pack contains; absent on packs registered without stats
        categories:
          type: object
          nullable: true
          additionalProperties: { type: integer }
          description: >
            Entries per pipeline category bucket, as registered in
            TranslationPackCreate.stats.categories. Null when the pack
            predates the field or stored an unusable blob - all or
            nothing, because a partially-read map would report content the
            pack does translate as uncovered.
        url: { type: string, description: public pack page }
        download_url:
          type: string
          description: >
            Kind-less on purpose. /api/packs/{id}/download resolves an
            absent `kind` to the resource pack; append
            `?kind=overrides` for the other channel, where a 404 means
            this pack has no overrides archive.
    GlossarySnapshotEntry:
      type: object
      description: >
        One rule in the glossary snapshot BODY - the gzip JSON array behind
        SnapshotManifest.url. The body is fetched straight from R2, so it is
        not an endpoint in this document.
      required: [source, target, scope, notes, key_scope]
      properties:
        source: { type: string, description: source-language term the rule matches }
        target: { type: string, description: replacement in the target language }
        scope:
          type: string
          description: >
            ORIGIN of the rule: `global` | `vanilla` | `modpack:{id}` |
            `mod:{slug}`. This is provenance only. It is NOT a lang-key
            scope and never restricts which keys the rule fires on - that
            is `key_scope`, an independent field. Never conflate the two.
          examples: [global, vanilla, "modpack:abc123", "mod:jei"]
        notes: { type: string, nullable: true, description: author note shown in the review UI }
        key_scope:
          type: array
          items: { type: string }
          description: >
            Lang keys this rule may fire on, as dotted globs: every segment
            is a literal or `*`, and a trailing `*` absorbs all remaining
            segments, so `effect.*` matches `effect.minecraft.wither`. An
            EMPTY array - or an absent field, as in every snapshot
            published before v5 - means the rule applies to every key,
            which is the pre-key_scope behaviour; old snapshots and engine
            builds that ignore the field are therefore unaffected. A
            non-empty list NARROWS the rule: vanilla "Wither" is the boss
            위더 under `entity.*` but the status effect 시듦 under
            `effect.*`, so a single unscoped rule corrupts one of the two
            senses.
          examples:
            - ["effect.*"]
            - ["entity.minecraft.wither"]
    SnapshotManifest:
      type: object
      required: [version, hash, size, url]
      properties:
        version: { type: string }
        hash: { type: string, description: sha256 of the gzip snapshot }
        size: { type: integer }
        url: { type: string, description: "R2 public URL of snapshot-{version}.json.gz" }
        entry_count: { type: integer }
    TmSnapshotEntry:
      type: object
      description: >
        One entry in the shared-TM snapshot BODY - the gzip JSON array
        behind SnapshotManifest.url, fetched straight from R2 and likewise
        not an endpoint in this document.
      required: [entry_key, source, target, pack_id]
      properties:
        entry_key: { type: string, description: lang key the translation came from }
        source: { type: string }
        target: { type: string }
        pack_id: { type: string, description: pack whose accepted correction produced it }
    TranslationPackCreate:
      type: object
      required: [modpack_name, target_lang, files, stats, engine_version]
      properties:
        pack_id:
          type: string
          description: existing owned TranslationPack to update with a new PackVersion
        project_kind:
          type: string
          enum: [modpack, mod]
          default: modpack
          description: mod requires authentication, curseforge_id and game_versions, and resource-only file kinds
        modpack_name: { type: string }
        modpack_version: { type: string }
        curseforge_id: { type: integer, nullable: true }
        curseforge_file_id: { type: integer, minimum: 1, description: Mod file the translation was made from }
        game_versions: { $ref: "#/components/schemas/MinecraftVersions" }
        loader: { type: string, maxLength: 30 }
        mod_pack_count:
          type: integer
          minimum: 0
          description: Modpack only; adds "모드별 팩 N개 포함" to its new-pack Discord announcement when positive
        target_lang: { type: string, example: ko_kr }
        source_lang: { type: string, default: en_us }
        description: { type: string }
        changelog: { type: string }
        files:
          type: array
          items:
            type: object
            required: [kind, object_key]
            properties:
              kind:
                type: string
                enum:
                  - resource_pack
                  - overrides
                  - resource_pack_bilingual
                  - overrides_bilingual
                description: >
                  One entry per uploaded archive; at most one per kind. The
                  `_bilingual` kinds are optional - registering only
                  resource_pack / overrides produces a plain-only pack, and
                  its download URLs behave exactly as before v4. Kinds the
                  request omits keep the pointer the pack already had, so an
                  append that re-renders only the plain archives does not drop
                  a previously uploaded bilingual pair. Downloads pick the
                  variant with `?variant=plain|bilingual` (absent = plain).
              object_key: { type: string }
        engine_version: { type: string }
        is_manual_translation: { type: boolean, description: 'Explicit manual/auto flag; server falls back to engine_version == "web-manual".' }
        artifact_id:
          type: string
          description: which compiled DSPy artifact produced this pack
        stats: { $ref: "#/components/schemas/PackStats" }
